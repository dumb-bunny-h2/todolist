<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pink Study Tracker</title>
    <link rel="icon"
        href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎀</text></svg>' />

    <!-- React + Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Calendar API -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    keyframes: {
                        'float-soft': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'sparkle': {
                            '0%, 100%': { opacity: '0', transform: 'scale(0)' },
                            '50%': { opacity: '1', transform: 'scale(1)' },
                        },
                        'slide-out-right': {
                            '0%': { opacity: '1', transform: 'translateX(0)' },
                            '100%': { opacity: '0', transform: 'translateX(30px)' },
                        },
                        'fade-in-up': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'float-soft': 'float-soft 4s ease-in-out infinite',
                        'sparkle': 'sparkle 2s ease-in-out infinite',
                        'slide-out': 'slide-out-right 0.3s ease-in-out forwards',
                        'fade-in': 'fade-in-up 0.4s ease-out forwards',
                    }
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --pink-primary: #f472b6;
            --pink-soft: #fff1f6;
        }

        body {
            font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 182, 193, 0.45), transparent 34%),
                radial-gradient(circle at 88% 8%, rgba(253, 186, 116, 0.28), transparent 25%),
                linear-gradient(135deg, #fff1f6 0%, #fff7fb 45%, #fffaf0 100%);
            min-height: 100vh;
            color: #3f2a35;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(244, 114, 182, 0.1);
        }

        .cute-grid {
            background-image:
                linear-gradient(rgba(244, 114, 182, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(244, 114, 182, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #fff1f6;
        }

        ::-webkit-scrollbar-thumb {
            background: #f9a8d4;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ec4899;
        }

        .spin-slow {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .font-emphasis {
            font-weight: 900;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Fragment, useRef } = React;

        // =========================
        // API CONFIG
        // =========================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUGXJ-pz0X_T0NeN665rGcR121NXHAMtAflHP9KpSD_wlVpMYDVBVyjBz_nuK-0vxt4g/exec";
        const GOOGLE_CLIENT_ID = "501142555959-b18ek5f4v9rj6rov5foiqjl02llrr8p6.apps.googleusercontent.com";
        const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";
        const SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly";

        // =========================
        // DATA
        // =========================
        const categories = [
            { name: "Học cá nhân", color: "text-pink-700", bg: "bg-pink-100" },
            { name: "Trường học", color: "text-violet-700", bg: "bg-violet-100" },
            { name: "IELTS", color: "text-sky-700", bg: "bg-sky-100" },
            { name: "CONTENT", color: "text-rose-700", bg: "bg-rose-100" },
            { name: "BANK", color: "text-indigo-700", bg: "bg-indigo-100" },
            { name: "FINANCE", color: "text-amber-700", bg: "bg-amber-100" },
            { name: "Cá nhân", color: "text-emerald-700", bg: "bg-emerald-100" }
        ];

        const topics = [
            {
                title: "Trường học",
                desc: "Tự thêm môn học và tài liệu theo từng môn",
                color: "from-pink-400 via-rose-400 to-fuchsia-500",
                emoji: "🎀",
                isSchool: true
            },
            {
                title: "IELTS",
                desc: "Speaking, Listening, Reading, Writing",
                color: "from-violet-400 via-fuchsia-400 to-pink-500",
                emoji: "🌷",
                subSections: [
                    { title: "General", emoji: "🌎", links: [] },
                    { title: "Speaking", emoji: "🎙️", links: [] },
                    { title: "Listening", emoji: "🎧", links: [] },
                    { title: "Reading", emoji: "📖", links: [] },
                    { title: "Writing", emoji: "✍️", links: [] }
                ]
            },
            {
                title: "CONTENT",
                desc: "Ý tưởng, kịch bản, kế hoạch nội dung",
                color: "from-rose-400 via-pink-400 to-orange-300",
                emoji: "🧁",
                links: []
            },
            {
                title: "BANK",
                desc: "Tài liệu ngân hàng, sản phẩm, quy trình",
                color: "from-sky-400 via-cyan-400 to-pink-300",
                emoji: "🏦",
                links: []
            },
            {
                title: "FINANCE",
                desc: "Tài chính, đầu tư, báo cáo và công thức",
                color: "from-amber-300 via-orange-300 to-pink-400",
                emoji: "💸",
                links: []
            }
        ];

        // =========================
        // ICONS
        // =========================
        const Icons = {
            Calendar: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                    <line x1="16" x2="16" y1="2" y2="6" />
                    <line x1="8" x2="8" y1="2" y2="6" />
                    <line x1="3" x2="21" y1="10" y2="10" />
                </svg>
            ),
            Clock: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            ),
            Plus: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                </svg>
            ),
            Trash: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M3 6h18" />
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                </svg>
            ),
            CheckCircle: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            ),
            History: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M12 7v5l4 2" />
                </svg>
            ),
            Sun: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2" />
                    <path d="M12 20v2" />
                    <path d="M4.93 4.93l1.41 1.41" />
                    <path d="M17.66 17.66l1.41 1.41" />
                    <path d="M2 12h2" />
                    <path d="M20 12h2" />
                    <path d="M6.34 17.66l-1.41 1.41" />
                    <path d="M19.07 4.93l-1.41 1.41" />
                </svg>
            ),
            Folder: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
                </svg>
            ),
            Link: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M10 13a5 5 0 0 0 7.07 0l2-2a5 5 0 0 0-7.07-7.07l-1.1 1.1" />
                    <path d="M14 11a5 5 0 0 0-7.07 0l-2 2a5 5 0 0 0 7.07 7.07l1.1-1.1" />
                </svg>
            ),
            Sync: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M21 12a9 9 0 0 0-15.5-6.3L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M3 12a9 9 0 0 0 15.5 6.3L21 16" />
                    <path d="M21 21v-5h-5" />
                </svg>
            ),
            LogOut: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" x2="9" y1="12" y2="12" />
                </svg>
            ),
            ArrowRight: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M5 12h14" />
                    <path d="m12 5 7 7-7 7" />
                </svg>
            ),
            ArrowLeft: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M19 12H5" />
                    <path d="m12 19-7-7 7-7" />
                </svg>
            ),
            MapPin: ({ className = "", size = 24 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
            )
        };

        // =========================
        // UTILITIES
        // =========================
        const getLocalDateString = (date = new Date()) => {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().split("T")[0];
        };

        const todayStr = getLocalDateString();
        const tomorrowStr = getLocalDateString(new Date(Date.now() + 86400000));
        const yesterdayStr = getLocalDateString(new Date(Date.now() - 86400000));

        const readLocalJson = (key, fallback) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            } catch {
                return fallback;
            }
        };

        const writeLocalJson = (key, value) => {
            localStorage.setItem(key, JSON.stringify(value));
        };

        const safeJsonParse = (text) => {
            try {
                return JSON.parse(text);
            } catch {
                return { status: "error", raw: text };
            }
        };

        const formatDateLabel = (dStr) => {
            if (!dStr) return "";
            if (dStr === todayStr) return "Hôm nay";
            if (dStr === tomorrowStr) return "Ngày mai";
            if (dStr === yesterdayStr) return "Hôm qua";
            const parts = dStr.split("-");
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        };

        const parseDateRange = (dateStr) => {
            if (!dateStr) return { start: todayStr, end: todayStr };
            if (dateStr.includes("|")) {
                const [start, end] = dateStr.split("|");
                return { start, end };
            }
            return { start: dateStr, end: dateStr };
        };

        const formatDisplayDate = (dateStr) => {
            const { start, end } = parseDateRange(dateStr);
            if (start === end) return formatDateLabel(start);
            const short = (d) => {
                const p = d.split("-");
                return `${p[2]}/${p[1]}`;
            };
            return `${short(start)} - ${short(end)}`;
        };

        const getWeekRange = () => {
            const currentDate = new Date();
            const currentDay = currentDate.getDay();
            const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay;

            const monday = new Date(currentDate);
            monday.setDate(currentDate.getDate() + diffToMonday);
            monday.setHours(0, 0, 0, 0);

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23, 59, 59, 999);

            return { monday, sunday };
        };

        const getCategoryStyle = (name) => {
            return categories.find(c => c.name === name) || {
                color: "text-slate-700",
                bg: "bg-slate-100"
            };
        };

        const sortExamsByDate = (items = []) => {
            return [...items].sort((a, b) => {
                const dateDiff = new Date(a.date || "9999-12-31") - new Date(b.date || "9999-12-31");
                if (dateDiff !== 0) return dateDiff;
                return String(a.time || "").localeCompare(String(b.time || ""));
            });
        };

        const normalizePlannerPayload = (data) => {
            if (Array.isArray(data)) {
                return {
                    tasks: data,
                    exams: readLocalJson("pink_exams", []),
                    customLinks: readLocalJson("pink_custom_links", {}),
                    schoolSubjects: readLocalJson("pink_school_subjects", [])
                };
            }

            const state = data && typeof data === "object"
                ? (data.state && typeof data.state === "object" ? data.state : data)
                : {};

            return {
                tasks: Array.isArray(state.tasks) ? state.tasks : readLocalJson("pink_tasks_cache", []),
                exams: Array.isArray(state.exams) ? state.exams : readLocalJson("pink_exams", []),
                customLinks: state.customLinks && typeof state.customLinks === "object" ? state.customLinks : readLocalJson("pink_custom_links", {}),
                schoolSubjects: Array.isArray(state.schoolSubjects) ? state.schoolSubjects : readLocalJson("pink_school_subjects", [])
            };
        };

        // =========================
        // APP
        // =========================
        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [exams, setExams] = useState(() => sortExamsByDate(readLocalJson("pink_exams", [])));
            const [customLinks, setCustomLinks] = useState(() => readLocalJson("pink_custom_links", {}));
            const [schoolSubjects, setSchoolSubjects] = useState(() => readLocalJson("pink_school_subjects", []));

            const [isDbLoading, setIsDbLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState("idle");
            const [syncMessage, setSyncMessage] = useState("");

            const [activeTab, setActiveTab] = useState("today");
            const [newTaskText, setNewTaskText] = useState("");
            const [newTaskCat, setNewTaskCat] = useState("Học cá nhân");
            const [newTaskStartDate, setNewTaskStartDate] = useState(todayStr);
            const [newTaskEndDate, setNewTaskEndDate] = useState(todayStr);
            const [animatingIds, setAnimatingIds] = useState([]);

            const [expandedTopic, setExpandedTopic] = useState(null);
            const [addingLinkTo, setAddingLinkTo] = useState(null);
            const [newLinkName, setNewLinkName] = useState("");
            const [newLinkUrl, setNewLinkUrl] = useState("");
            const [newSubjectName, setNewSubjectName] = useState("");

            const [showAddExam, setShowAddExam] = useState(false);
            const [newExamName, setNewExamName] = useState("");
            const [newExamDate, setNewExamDate] = useState("");
            const [newExamTime, setNewExamTime] = useState("");
            const [newExamLocation, setNewExamLocation] = useState("");
            const [newExamLink, setNewExamLink] = useState("");
            const [newExamNote, setNewExamNote] = useState("");

            const [gapiReady, setGapiReady] = useState(false);
            const [isCalAuthorized, setIsCalAuthorized] = useState(false);
            const [isFetchingEvents, setIsFetchingEvents] = useState(false);
            const [calendarEvents, setCalendarEvents] = useState(() => readLocalJson("pink_calendar_events", []));

            const hasLoadedFromDb = useRef(false);

            // =========================
            // LOCAL STORAGE
            // =========================
            useEffect(() => writeLocalJson("pink_tasks_cache", tasks), [tasks]);
            useEffect(() => writeLocalJson("pink_exams", exams), [exams]);
            useEffect(() => writeLocalJson("pink_custom_links", customLinks), [customLinks]);
            useEffect(() => writeLocalJson("pink_school_subjects", schoolSubjects), [schoolSubjects]);
            useEffect(() => writeLocalJson("pink_calendar_events", calendarEvents), [calendarEvents]);

            // =========================
            // GOOGLE API INIT
            // =========================
            useEffect(() => {
                const initializeGapiClient = async () => {
                    await window.gapi.client.init({
                        discoveryDocs: [DISCOVERY_DOC]
                    });

                    const savedToken = localStorage.getItem("pink_gapi_token_info");

                    if (savedToken) {
                        try {
                            const tokenObj = JSON.parse(savedToken);
                            window.gapi.client.setToken({ access_token: tokenObj.access_token });
                            setIsCalAuthorized(true);
                        } catch {
                            localStorage.removeItem("pink_gapi_token_info");
                        }
                    }

                    setGapiReady(true);
                };

                const loadApis = () => {
                    window.tokenClient = window.google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: SCOPES,
                        callback: (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                localStorage.setItem("pink_gapi_token_info", JSON.stringify({
                                    access_token: tokenResponse.access_token
                                }));
                                setIsCalAuthorized(true);
                            }
                        }
                    });

                    window.gapi.load("client", initializeGapiClient);
                };

                const checkScripts = setInterval(() => {
                    if (window.gapi && window.google) {
                        clearInterval(checkScripts);
                        loadApis();
                    }
                }, 120);

                return () => clearInterval(checkScripts);
            }, []);

            useEffect(() => {
                if (isCalAuthorized && gapiReady) {
                    fetchCalendarEvents();
                }
            }, [isCalAuthorized, gapiReady]);

            // =========================
            // LOAD DB
            // =========================
            useEffect(() => {
                const loadPlannerData = async () => {
                    try {
                        const res = await fetch(`${SCRIPT_URL}?action=read&_=${Date.now()}`, {
                            method: "GET",
                            redirect: "follow",
                            cache: "no-store"
                        });

                        const text = await res.text();
                        const data = safeJsonParse(text);
                        const planner = normalizePlannerPayload(data);

                        setTasks(planner.tasks);
                        setExams(sortExamsByDate(planner.exams));
                        setCustomLinks(planner.customLinks);
                        setSchoolSubjects(planner.schoolSubjects);

                        setSyncMessage("Đã tải DB");
                    } catch (err) {
                        console.error("Không tải được DB, dùng cache local:", err);

                        setTasks(readLocalJson("pink_tasks_cache", []));
                        setExams(sortExamsByDate(readLocalJson("pink_exams", [])));
                        setCustomLinks(readLocalJson("pink_custom_links", {}));
                        setSchoolSubjects(readLocalJson("pink_school_subjects", []));

                        setSyncMessage("Đang dùng cache local vì chưa tải được DB");
                    } finally {
                        hasLoadedFromDb.current = true;
                        setIsDbLoading(false);
                    }
                };

                loadPlannerData();
            }, []);

            // =========================
            // SAVE DB
            // =========================
            useEffect(() => {
                if (isDbLoading || !hasLoadedFromDb.current) return;

                const timeout = setTimeout(async () => {
                    try {
                        setSyncStatus("syncing");
                        setSyncMessage("Đang lưu việc cần làm và lịch kiểm tra vào DB...");

                        const state = {
                            tasks,
                            exams: sortExamsByDate(exams),
                            customLinks,
                            schoolSubjects
                        };

                        const payload = {
                            action: "writeFull",
                            version: 5,
                            theme: "pink-cute-single-html",
                            updatedAt: new Date().toISOString(),
                            ...state,
                            state
                        };

                        const res = await fetch(SCRIPT_URL, {
                            method: "POST",
                            headers: {
                                "Content-Type": "text/plain;charset=utf-8"
                            },
                            body: JSON.stringify(payload),
                            redirect: "follow"
                        });

                        const text = await res.text();
                        const data = safeJsonParse(text);

                        if (data.status === "success" || data.ok === true || data.result === "success") {
                            setSyncStatus("saved");
                            setSyncMessage("Đã lưu DB");
                            setTimeout(() => setSyncStatus("idle"), 1800);
                        } else {
                            throw new Error(data.message || data.raw || "Apps Script không trả về status success");
                        }
                    } catch (err) {
                        console.error("Không lưu được DB:", err);
                        setSyncStatus("error");
                        setSyncMessage("Lỗi đồng bộ DB: kiểm tra Code.gs có hỗ trợ action writeFull không");
                    }
                }, 900);

                return () => clearTimeout(timeout);
            }, [tasks, exams, customLinks, schoolSubjects, isDbLoading]);

            // =========================
            // GOOGLE CALENDAR FUNCTIONS
            // =========================
            const handleAuthClick = () => {
                if (!window.tokenClient) return;
                window.tokenClient.requestAccessToken({ prompt: "consent" });
            };

            const handleSignoutClick = () => {
                const token = window.gapi?.client?.getToken?.();

                if (token !== null && token?.access_token) {
                    window.google.accounts.oauth2.revoke(token.access_token);
                }

                window.gapi?.client?.setToken?.("");
                localStorage.removeItem("pink_gapi_token_info");
                setIsCalAuthorized(false);
            };

            const fetchCalendarEvents = async () => {
                if (!window.gapi?.client?.calendar) return;

                setIsFetchingEvents(true);

                try {
                    const { monday, sunday } = getWeekRange();

                    const calendarListRes = await window.gapi.client.calendar.calendarList.list();
                    const calendars = calendarListRes.result.items || [];

                    let allEvents = [];

                    const fetchPromises = calendars.filter(cal => cal.selected).map(async (cal) => {
                        try {
                            const response = await window.gapi.client.calendar.events.list({
                                calendarId: cal.id,
                                timeMin: monday.toISOString(),
                                timeMax: sunday.toISOString(),
                                showDeleted: false,
                                singleEvents: true,
                                maxResults: 100,
                                orderBy: "startTime"
                            });

                            const items = response.result.items || [];

                            return items.map(item => ({
                                ...item,
                                backgroundColor: item.backgroundColor || cal.backgroundColor,
                                calendarSummary: cal.summary
                            }));
                        } catch (e) {
                            console.warn("Không thể lấy lịch:", cal.summary, e);
                            return [];
                        }
                    });

                    const results = await Promise.all(fetchPromises);

                    results.forEach(items => {
                        allEvents = allEvents.concat(items);
                    });

                    allEvents.sort((a, b) => {
                        const timeA = new Date(a.start.dateTime || a.start.date).getTime();
                        const timeB = new Date(b.start.dateTime || b.start.date).getTime();
                        return timeA - timeB;
                    });

                    setCalendarEvents(allEvents);
                } catch (err) {
                    console.error("Lỗi Calendar:", err);

                    if (err.status === 401 || err.status === 403) {
                        window.gapi?.client?.setToken?.("");
                        localStorage.removeItem("pink_gapi_token_info");
                        setIsCalAuthorized(false);
                    }
                } finally {
                    setIsFetchingEvents(false);
                }
            };

            // =========================
            // TASK FUNCTIONS
            // =========================
            const handleAddTask = () => {
                if (!newTaskText.trim()) return;

                const finalDate = newTaskStartDate === newTaskEndDate
                    ? newTaskStartDate
                    : `${newTaskStartDate}|${newTaskEndDate}`;

                const newTask = {
                    id: "t_" + Date.now(),
                    text: newTaskText.trim(),
                    category: newTaskCat,
                    date: finalDate,
                    status: "pending",
                    completedAt: null
                };

                setTasks(prev => [...prev, newTask]);
                setNewTaskText("");
            };

            const completeTask = (id) => {
                setAnimatingIds(prev => [...prev, id]);

                setTimeout(() => {
                    setTasks(prev => prev.map(t => {
                        if (t.id === id) {
                            return {
                                ...t,
                                status: "completed",
                                completedAt: Date.now()
                            };
                        }

                        return t;
                    }));

                    setAnimatingIds(prev => prev.filter(a => a !== id));
                }, 300);
            };

            const deleteTask = (id) => {
                if (confirm("Bạn có chắc chắn muốn xóa công việc này?")) {
                    setTasks(prev => prev.filter(t => t.id !== id));
                }
            };

            const moveTaskDate = (id, newStartStr) => {
                setTasks(prev => prev.map(t => {
                    if (t.id !== id) return t;

                    const { start, end } = parseDateRange(t.date);

                    const startObj = new Date(start + "T00:00:00");
                    const endObj = new Date(end + "T00:00:00");
                    const diff = endObj - startObj;

                    const newStartObj = new Date(newStartStr + "T00:00:00");
                    const newEndObj = new Date(newStartObj.getTime() + diff);
                    const newEndStr = getLocalDateString(newEndObj);

                    const finalDate = newStartStr === newEndStr
                        ? newStartStr
                        : `${newStartStr}|${newEndStr}`;

                    return {
                        ...t,
                        date: finalDate
                    };
                }));
            };

            // =========================
            // EXAM FUNCTIONS
            // =========================
            const calculateDaysLeft = (dateStr) => {
                const today = new Date(todayStr + "T00:00:00");
                const target = new Date(dateStr + "T00:00:00");
                const diffTime = target - today;
                return Math.ceil(diffTime / 86400000);
            };

            const handleAddExam = async () => {
                if (!newExamName.trim() || !newExamDate) return;

                const newExam = {
                    id: "exam_" + Date.now(),
                    name: newExamName.trim(),
                    date: newExamDate,
                    time: newExamTime,
                    location: newExamLocation.trim(),
                    link: newExamLink.trim(),
                    note: newExamNote.trim()
                };

                if (isCalAuthorized && window.gapi?.client?.calendar) {
                    try {
                        const event = {
                            summary: `[Lịch] ${newExam.name}`,
                            location: newExam.location,
                            description: [newExam.note, newExam.link].filter(Boolean).join("\n")
                        };

                        if (newExam.time) {
                            const startDateTime = new Date(`${newExam.date}T${newExam.time}:00`);
                            const endDateTime = new Date(startDateTime.getTime() + 2 * 60 * 60 * 1000);

                            event.start = {
                                dateTime: startDateTime.toISOString(),
                                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                            };

                            event.end = {
                                dateTime: endDateTime.toISOString(),
                                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                            };
                        } else {
                            const nextDay = new Date(newExam.date + "T00:00:00");
                            nextDay.setDate(nextDay.getDate() + 1);

                            event.start = {
                                date: newExam.date,
                                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                            };

                            event.end = {
                                date: getLocalDateString(nextDay),
                                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                            };
                        }

                        const request = await window.gapi.client.calendar.events.insert({
                            calendarId: "primary",
                            resource: event
                        });

                        newExam.gcalEventId = request.result.id;
                        fetchCalendarEvents();
                    } catch (err) {
                        console.error("Không thêm được Google Calendar:", err);
                    }
                }

                setExams(prev => sortExamsByDate([...prev, newExam]));

                setNewExamName("");
                setNewExamDate("");
                setNewExamTime("");
                setNewExamLocation("");
                setNewExamLink("");
                setNewExamNote("");

            const handleDeleteExam = async (id) => {

                    try {
                        await window.gapi.client.calendar.events.delete({
                            calendarId: "primary",
                            eventId: examToDelete.gcalEventId

                        fetchCalendarEvents();
                    } catch (err) {
                        console.error("Không xóa được trên Google Calendar:", err);
                    }
                }

                setExams(prev => prev.filter(e => e.id !== id));
            };

            // =========================
            // RESOURCE FUNCTIONS
            // =========================
            const toggleTopic = (index) => {
                setExpandedTopic(expandedTopic === index ? null : index);
            };

            const handleAddCustomLink = (key) => {
                if (!newLinkName.trim()) return;

                setCustomLinks(prev => ({

                        const links = customLinks[key] || [];

                        total += links.length;
                        completed += links.filter(l => l.completed).length;

                } else {

                    const links = customLinks[key] || [];

                    total += links.length;
                    completed += links.filter(l => l.completed).length;

            // =========================

            const completedTasks = tasks.filter(t => t.status === "completed").sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

                    { bg: "bg-amber-50", border: "border-amber-200", headerBg: "bg-amber-100", text: "text-amber-700", ring: "ring-amber-400" },
                    { bg: "bg-emerald-50", border: "border-emerald-200", headerBg: "bg-emerald-100", text: "text-emerald-700", ring: "ring-emerald-400" },
                    { bg: "bg-cyan-50", border: "border-cyan-200", headerBg: "bg-cyan-100", text: "text-cyan-700", ring: "ring-cyan-400" },
                    { bg: "bg-indigo-50", border: "border-indigo-200", headerBg: "bg-indigo-100", text: "text-indigo-700", ring: "ring-indigo-400" },
                    { bg: "bg-purple-50", border: "border-purple-200", headerBg: "bg-purple-100", text: "text-purple-700", ring: "ring-purple-400" }
                ];

                const daysOfWeek = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "C.Nhật"];

                return (
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-8 mt-2 w-full">

                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 48 48" className="text-blue-500">
                                    <path fill="#4285F4" d="M3 10.5C3 8.01 5.01 6 7.5 6h9v36h-9C5.01 42 3 39.99 3 37.5v-27z" />
                                    <path fill="#34A853" d="M31.5 6h9C42.99 6 45 8.01 45 10.5v27c0 2.49-2.01 4.5-4.5 4.5h-9V6z" />

                            <div className="flex items-center gap-3">
                                {isFetchingEvents && (
                                    <span className="text-sm text-slate-500 flex items-center gap-2">
                                        <Icons.Sync size={14} className="spin-slow" />
                                        ...
                                    </span>
                                )}

                                {isCalAuthorized ? (
                                    <div className="flex gap-2">
                                        <button
                                            onClick={fetchCalendarEvents}
                                            className="bg-blue-600 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
                                        >
                                            Làm mới / Đồng bộ Calendar
                                        </button>

                                        <button
                                            onClick={handleSignoutClick}
                                            title="Đăng xuất"
                                            className="text-slate-400 hover:text-rose-600 transition-colors p-2 bg-slate-50 rounded-lg hover:bg-rose-50 border border-transparent hover:border-slate-200"
                                        >
                                            <Icons.LogOut size={16} />
                                        </button>

                                    <button

                                                    const timeDisplay = isAllDay
                                                        ? "Cả ngày"

                                                    return (

                                                            <p className="font-semibold text-slate-700 leading-snug text-xs md:text-sm truncate" title={ev.summary}>
                                                                {ev.summary || "Sự kiện"}
                                                            </p>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            // =========================
            // RENDER TASK ITEM
            // =========================
            const renderTaskItem = (task) => {
                const isAnimating = animatingIds.includes(task.id);
                const catStyle = getCategoryStyle(task.category);

                const { start, end } = parseDateRange(task.date);

                const isOverdue = end < todayStr && task.status === "pending";
                const isMultiDay = start !== end;

                const shouldShowDate = task.status === "pending" && (start > todayStr || isMultiDay);

                return (
                    <div

                    >
                        {task.status === "pending" ? (
                            <button
                                onClick={() => completeTask(task.id)}
                                className="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center hover:border-emerald-500 hover:bg-emerald-50 transition-colors flex-shrink-0"
                            >
                                <Icons.CheckCircle size={14} className="text-emerald-500 opacity-0 group-hover:opacity-100 transition-opacity" />
                            </button>
                        ) : (
                            <div className="w-6 h-6 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0">
                                <Icons.CheckCircle size={14} className="text-emerald-600" />

                        <div className="flex-1 min-w-0">

                                    {task.category}

                                    className="p-1.5 md:p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-colors"

                            placeholder={placeholder}
                            className="text-sm px-3 py-2 border border-slate-200 rounded-md outline-none focus:border-pink-400"
                            value={newLinkName}
                            onChange={e => setNewLinkName(e.target.value)}
                        />

                                                                        <Icons.Clock size={12} />
                                                                        {exam.time}
                                                                    </span>
                                                                )}

                                                                {exam.location && (
                                                                    <span className="flex items-center gap-1 truncate">
                                                                        <Icons.MapPin size={12} />
                                                                        {exam.location}
                                                                    </span>
                                                                )}

                                                                {exam.note && (
                                                                    <span className="flex items-center gap-1 bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-bold">
                                                                        {exam.note}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div className="flex flex-col items-end">
                                                            {isPast ? (
                                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                                                                    Đã qua
                                                                </span>
                                                            ) : (
                                                                <div className="text-right">
                                                                    <span className={`text-xl font-black ${isUrgent ? "text-rose-600" : "text-cyan-600"}`}>
                                                                        {daysLeft}
                                                                    </span>

                                                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">
                                                                        Ngày
                                                                    </span>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <button
                                                            onClick={() => handleDeleteExam(exam.id)}
                                                            className="absolute -right-2 -top-2 w-6 h-6 bg-white border border-slate-200 rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 hover:border-rose-200 shadow-sm opacity-0 group-hover:opacity-100 transition-all"
                                                        >
                                                            <Icons.Trash size={12} />
                                                        </button>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>

                                <h3 className="text-2xl font-emphasis text-slate-800 flex items-center gap-2 mb-2 mt-4">
                                    <Icons.Folder className="text-pink-600" />
                                    Tài liệu học tập
                                </h3>

                                <div className="space-y-5">
                                    {topics.map((topic, idx) => {
                                        const progress = getTopicProgress(topic, idx);

                                        return (
                                            <div
                                                key={idx}
                                                className={`bg-white rounded-2xl p-6 shadow-sm border border-slate-200 transition-all duration-300 group ${expandedTopic === idx ? "ring-2 ring-pink-500/50 shadow-md" : "hover:border-pink-300 hover:shadow-md cursor-pointer"}`}
                                                onClick={() => expandedTopic !== idx && toggleTopic(idx)}
                                            >
                                                <div className="flex justify-between items-end mb-4">
                                                    <div className="pr-4">
                                                        <h3 className={`text-xl font-bold font-emphasis flex items-center gap-2 ${expandedTopic === idx ? "text-pink-700" : "text-slate-800 group-hover:text-pink-700"}`}>
                                                            <span>{topic.emoji}</span>
                                                            {topic.title}
                                                        </h3>

                                                        <p className="text-slate-500 text-sm mt-1 leading-snug">
                                                            {topic.desc}
                                                        </p>
                                                    </div>

                                                    <span className="text-xs font-black text-pink-500 bg-pink-50 border border-pink-100 rounded-full px-3 py-1">
                                                        {progress}%
                                                    </span>
                                                </div>

                                                <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                                                    <div
                                                        className={`h-full bg-gradient-to-r ${topic.color} rounded-full opacity-90 transition-all duration-1000`}
                                                        style={{ width: `${progress}%` }}
                                                    ></div>
                                                </div>

                                                <div
                                                    className={`transition-all duration-500 ease-in-out overflow-hidden ${expandedTopic === idx ? "max-h-[1800px] opacity-100 mt-5 pt-5 border-t border-slate-100" : "max-h-0 opacity-0 mt-0 pt-0 border-transparent"}`}
                                                    onClick={e => e.stopPropagation()}
                                                >
                                                    {renderTopicContent(topic, idx)}

                                                    <div className="mt-4 flex justify-end">
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                toggleTopic(idx);
                                                            }}
                                                            className="text-xs font-bold text-slate-400 hover:text-slate-700 uppercase tracking-widest px-3 py-1.5 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors"
                                                        >
                                                            Đóng lại
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
